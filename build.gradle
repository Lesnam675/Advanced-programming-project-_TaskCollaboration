plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.aastu'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version = "21"
    modules = [ 'javafx.controls' ]
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'com.aastu.taskmanagersystem.client.ui.LoginScreen'
}

springBoot {
    mainClass = 'com.aastu.taskmanagersystem.backend.TaskManagerSystemApplication'
}

tasks.named('bootRun') {
    mainClass = 'com.aastu.taskmanagersystem.backend.TaskManagerSystemApplication'
}

tasks.register('runSocketServer', JavaExec) {
    group = 'application'
    description = 'Runs the real-time task socket server on port 5000'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.aastu.taskmanagersystem.backend.socket.TaskServer'
}

tasks.register('runLogin') {
    group = 'application'
    description = 'Runs the JavaFX login screen'
    dependsOn 'run'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('run', JavaExec) {
    jvmArgs += ['--enable-native-access=javafx.graphics']
}

